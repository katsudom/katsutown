<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%231E1A21'/><path d='M8 2L14 7H2Z' fill='%23C2283C'/><rect x='4' y='7' width='8' height='7' fill='%23F7EBD3'/><rect x='7' y='10' width='2' height='4' fill='%23C2283C'/><rect x='5' y='8' width='2' height='2' fill='%234E7F9C'/><rect x='9' y='8' width='2' height='2' fill='%234E7F9C'/></svg>"
    />
    <title>Katsudom Town — Dominic Pham</title>
    <meta
      name="description"
      content="Katsudom Town: an explorable pixel-RPG portfolio for Dominic Pham, Computer Science student at the University of Oklahoma."
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1a21;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        margin: 0 auto;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f7ebd3;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript>
      <div id="boot-fallback">
        Katsudom Town needs JavaScript. The plain-text portfolio works without it:
        <a href="./classic.html" style="color: #e04a5a">open the regular portfolio</a>.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
